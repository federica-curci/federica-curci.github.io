        type: text

content:
  - name: site
    label: Website Content
    type: file
    path: content/site.json
    format: json
    fields:
      - name: profile
        label: Profile, Contact, Links
        type: object
        fields:
          - name: email
            label: Email
            type: string
          - name: linkedin
            label: LinkedIn URL
            type: string
          - name: website
            label: Website URL
            type: string
          - name: linksIntro
            label: Link page intro
            type: text
      - name: images
        label: Images
        type: object
        fields:
          - name: hero
            label: Hero photo
            component: imageSlot
          - name: workHeading
            label: Work intro photo
            component: imageSlot
          - name: caseOne
            label: Case 1 photo
            component: imageSlot
          - name: caseTwo
            label: Case 2 photo
            component: imageSlot
          - name: caseThree
            label: Case 3 photo
            component: imageSlot
      - name: cases
        label: Portfolio cases
        type: list
        fields:
          - name: style
            label: Visual style
            type: string
            description: Use beijing, shanghai, or europe.
          - name: image
            label: Photo
            component: imageSlot
          - name: place
            label: Place label
            type: string
            description: HTML such as <br /> is allowed.
          - name: mark
            label: Decorative mark
            type: string
            required: false
            description: Optional. Leave empty for the line-map decoration.
          - name: tag
            label: Language tag
            type: string
          - name: languages
            label: Case text by language
            type: object
            fields:
              - name: it
                label: Italian
                component: caseLanguageFields
              - name: en
                label: English
                component: caseLanguageFields
              - name: zh
                label: Chinese
                component: caseLanguageFields
      - name: languages
        label: Text by language
        type: object
        fields:
          - name: it
            label: Italian
            component: languageFields
          - name: en
            label: English
            component: languageFields
          - name: zh
            label: Chinese
            component: languageFields
