media:
  input: content
  output: /content
  extensions: [jpg, jpeg, png, webp, gif, svg]
  rename: safe

components:
  imageSlot:
    type: object
    fields:
      - name: src
        label: Immagine
        type: image
      - name: alt
        label: Testo alternativo
        type: string
      - name: caption
        label: Didascalia
        type: text
        required: false
        description: Lascia vuoto se non serve. Puoi usare HTML semplice.

  galleryItem:
    type: object
    fields:
      - name: src
        label: Foto
        type: image
      - name: alt
        label: Testo alternativo
        type: string
      - name: caption
        label: Didascalia
        type: text
        required: false

  formationItem:
    type: object
    fields:
      - name: title
        label: Titolo
        type: string
      - name: paragraphs
        label: Testi
        type: text
        list:
          collapsible:
            collapsed: true
            summary: "Paragrafo {index}"
        description: Puoi usare HTML semplice, per esempio <strong>testo</strong>.

  processStep:
    type: object
    fields:
      - name: title
        label: Titolo
        type: string
      - name: text
        label: Testo
        type: text
        description: Puoi usare HTML semplice, per esempio <strong>testo</strong>.

  faqItem:
    type: object
    fields:
      - name: question
        label: Domanda
        type: string
      - name: answer
        label: Risposta
        type: text
      - name: open
        label: Aperta di default
        type: boolean
        required: false

content:
  - name: site
    label: Website Content
    type: file
    path: content/site.json
    format: json
    fields:
      - name: profile
        label: Profilo e link
        type: object
        fields:
          - name: email
            label: Email
            type: string
          - name: phone
            label: Telefono
            type: string
          - name: phoneHref
            label: Link telefono
            type: string
            description: Esempio tel:+393406573679
          - name: whatsapp
            label: Link WhatsApp
            type: string
          - name: linkedin
            label: LinkedIn
            type: string
          - name: website
            label: Sito
            type: string
          - name: linksIntro
            label: Intro pagina link
            type: text

      - name: images
        label: Immagini principali
        type: object
        fields:
          - name: hero
            label: Foto hero
            component: imageSlot
          - name: workHeading
            label: Foto Su di me
            component: imageSlot

      - name: galleries
        label: Gallerie fotografiche
        type: object
        fields:
          - name: interpretazione_b2b
            label: Interpretazione di trattativa o B2B
            component: galleryItem
            list:
              collapsible:
                collapsed: true
                summary: "{caption}"
          - name: interpretazione_consecutiva
            label: Interpretazione consecutiva
            component: galleryItem
            list:
              collapsible:
                collapsed: true
                summary: "{caption}"
          - name: interpretazione_simultanea
            label: Simultanea, sussurrata o chuchotage
            component: galleryItem
            list:
              collapsible:
                collapsed: true
                summary: "{caption}"

      - name: languages
        label: Testi principali
        type: object
        fields:
          - name: it
            label: Italiano
            type: object
            fields:
              - name: hero_title
                label: Titolo hero
                type: text
                description: Puoi usare <br />, <em> e <strong>.
              - name: hero_intro
                label: Testo hero
                type: text
                description: Puoi usare HTML semplice.
              - name: hero_cta
                label: Bottone hero
                type: string
              - name: hero_link
                label: Link secondario hero
                type: string
              - name: work_eyebrow
                label: Etichetta Su di me
                type: string
              - name: work_title
                label: Titolo Su di me
                type: text
              - name: work_intro
                label: Testo Su di me
                type: text
                description: Puoi usare paragrafi HTML e <strong>.
              - name: case_one_type
                label: B2B, sottotitolo
                type: string
              - name: case_one_title
                label: B2B, frase in evidenza
                type: text
              - name: case_one_text
                label: B2B, testo
                type: text
              - name: case_two_type
                label: Consecutiva, sottotitolo
                type: string
              - name: case_two_title
                label: Consecutiva, frase in evidenza
                type: text
              - name: case_two_text
                label: Consecutiva, testo
                type: text
              - name: case_three_type
                label: Simultanea e chuchotage, sottotitolo
                type: string
              - name: case_three_title
                label: Simultanea e chuchotage, frase in evidenza
                type: text
              - name: case_three_text
                label: Simultanea e chuchotage, testo
                type: text
              - name: footer
                label: Footer
                type: string

      - name: sections
        label: Sezioni del sito
        type: object
        fields:
          - name: translation
            label: Traduzione
            type: object
            fields:
              - name: title
                label: Titolo
                type: text
              - name: image
                label: Immagine
                component: imageSlot
              - name: paragraphs
                label: Paragrafi
                type: text
                list:
                  collapsible:
                    collapsed: true
                    summary: "Paragrafo {index}"
                description: Puoi usare HTML semplice.

          - name: consulting
            label: Consulenza
            type: object
            fields:
              - name: title
                label: Titolo
                type: text
              - name: image
                label: Immagine
                component: imageSlot
              - name: paragraphs
                label: Paragrafi
                type: text
                list:
                  collapsible:
                    collapsed: true
                    summary: "Paragrafo {index}"
                description: Puoi usare HTML semplice.

          - name: formation
            label: Formazione
            type: object
            fields:
              - name: title
                label: Titolo
                type: text
              - name: lead
                label: Testo introduttivo
                type: text
              - name: items
                label: Blocchi formazione
                component: formationItem
                list:
                  collapsible:
                    collapsed: true
                    summary: "{title}"

          - name: process
            label: Come lavoro
            type: object
            fields:
              - name: title
                label: Titolo
                type: text
              - name: steps
                label: Passaggi
                component: processStep
                list:
                  collapsible:
                    collapsed: true
                    summary: "{title}"

          - name: contact
            label: Contatti
            type: object
            fields:
              - name: title
                label: Titolo
                type: string
              - name: note
                label: Nota
                type: text
              - name: email
                label: Email
                type: string
              - name: phone
                label: Telefono
                type: string
              - name: phoneHref
                label: Link telefono
                type: string
              - name: whatsapp
                label: Link WhatsApp
                type: string
              - name: formName
                label: Campo nome
                type: string
              - name: formEmail
                label: Campo email
                type: string
              - name: formProject
                label: Campo progetto
                type: string
              - name: formProjectPlaceholder
                label: Placeholder progetto
                type: string
              - name: formSubmit
                label: Bottone form
                type: string
              - name: formNote
                label: Nota form
                type: text

          - name: faq
            label: Domande frequenti
            type: object
            fields:
              - name: title
                label: Titolo
                type: text
              - name: items
                label: Domande
                component: faqItem
                list:
                  collapsible:
                    collapsed: true
                    summary: "{question}"
